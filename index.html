<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gestão de Equipamentos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="theme-color" content="#e5342b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agroser">
<style>
:root{
  --red:#e5342b; --red-dark:#c22a22; --bg:#f4f5f7; --card:#ffffff; --text:#1c1c1e;
  --sub:#6b7280; --border:#e5e7eb; --green:#1a9e5c;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#101114; --card:#1b1c20; --text:#f2f2f3; --sub:#9aa0a6; --border:#2b2d31; }
}
:root[data-theme="dark"]{ --bg:#101114; --card:#1b1c20; --text:#f2f2f3; --sub:#9aa0a6; --border:#2b2d31; }
html{ scroll-padding-top: env(safe-area-inset-top,0px); background:var(--red-dark); }
*{ box-sizing:border-box; }
html, body{
  height:100%; overflow:hidden; overscroll-behavior:none;
  touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); position:fixed; inset:0;
}
#app{ max-width:480px; margin:0 auto; height:100%; background:var(--bg); display:flex; flex-direction:column; }
input, textarea{ -webkit-user-select:text; user-select:text; }

/* HEADER */
header{
  background:linear-gradient(180deg,var(--red),var(--red-dark));
  color:#fff; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:20;
}
header .title{ flex:1; font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
header button.icon{ background:rgba(255,255,255,.15); border:none; color:#fff; width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.avatar{ width:32px; height:32px; border-radius:50%; background:#fff; color:var(--red); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; cursor:pointer; }

/* BREADCRUMB BAR */
.subbar{ padding:12px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background:var(--bg); }
.subbar h2{ margin:0; font-size:20px; font-weight:600; }
.subbar .sync-status{ font-size:11px; color:var(--sub); }

main{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }

/* LOGIN */
.login-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; gap:18px; }
.login-wrap h1{ font-size:20px; margin:0 0 4px; }
.login-wrap p{ color:var(--sub); font-size:13px; margin:0; text-align:center; }
select, input{
  width:100%; max-width:300px; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
  background:var(--card); color:var(--text); font-size:15px;
}
.btn{
  background:var(--red); color:#fff; border:none; padding:12px 20px; border-radius:10px; font-size:15px;
  font-weight:600; cursor:pointer; width:100%; max-width:300px;
}
.btn:active{ background:var(--red-dark); }
.btn:disabled{ opacity:.6; cursor:default; }
.btn.secondary{ background:transparent; color:var(--red); border:1px solid var(--red); }

/* HOME LIST (categorias) */
.row{
  display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--border);
  background:var(--card); cursor:pointer;
}
.row:active{ background:var(--bg); }
.row .icon-circle{
  width:46px; height:46px; border-radius:50%; background:var(--bg); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;
}
.row .icon-circle svg{ width:26px; height:26px; }
.row .icon-circle img{ width:60%; height:60%; object-fit:contain; display:block; }
.row .label{ font-size:15px; font-weight:600; flex:1; }
.row .count{ font-size:12px; color:var(--sub); background:var(--bg); padding:3px 8px; border-radius:20px; }
.row .chev{ color:var(--sub); }

.logo-empresa{ display:block; max-height:56px; max-width:70%; object-fit:contain; margin:20px auto 4px; }

/* ITEM LIST */
.item{ display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border); background:var(--card); cursor:pointer; }
.item:active{ background:var(--bg); }
.item .thumb{
  width:56px; height:56px; border-radius:8px; background:var(--bg); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--sub); overflow:hidden;
}
.item .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.item .info{ flex:1; min-width:0; }
.item .nome{ font-size:13.5px; font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.item .meta{ font-size:11.5px; color:var(--sub); margin-top:3px; }
.item .preco{ font-size:14px; font-weight:700; color:var(--green); margin-top:4px; }
.badge{ display:inline-block; font-size:10px; padding:2px 6px; border-radius:5px; margin-left:6px; font-weight:600; }
.badge.novo{ background:#e6f4ea; color:#1a7f37; }
.badge.usado{ background:#fdf1e6; color:#b5641a; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .badge.novo{background:#123321;color:#5bd08a;} }
:root[data-theme="dark"] .badge.novo{background:#123321;color:#5bd08a;}

.search-box{ display:flex; align-items:center; gap:8px; margin:10px 16px 0; padding:9px 12px; border-radius:12px; background:var(--card); border:1px solid var(--border); color:var(--sub); }
.search-box svg{ flex:none; }
.search-box input{ flex:1; min-width:0; border:none; outline:none; background:none; font-size:14px; color:var(--text); font-family:inherit; }
.search-box input::-webkit-search-cancel-button{ display:none; }
.search-clear{ flex:none; display:none; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; border:none; background:var(--border); color:var(--sub); cursor:pointer; padding:0; }
.filters{ display:flex; gap:8px; padding:10px 16px; overflow-x:auto; background:var(--bg); }
.chip{ padding:6px 12px; border-radius:20px; border:1px solid var(--border); font-size:12px; white-space:nowrap; cursor:pointer; background:var(--card); color:var(--text); }
.chip.active{ background:var(--red); border-color:var(--red); color:#fff; }

.empty{ padding:40px 20px; text-align:center; color:var(--sub); font-size:13px; }

/* DETAIL */
.detail{ padding:20px 16px; }
.detail .hero{ width:100%; aspect-ratio:16/10; border-radius:14px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--sub); margin-bottom:10px; overflow:hidden; position:relative; }
.detail .hero img{ width:100%; height:100%; object-fit:cover; display:block; }
.hero-dots{ display:flex; gap:6px; justify-content:center; margin-bottom:16px; }
.hero-dots .dot{ width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; }
.hero-dots .dot.active{ background:var(--red); }
.detail h2{ font-size:18px; margin:0 0 6px; line-height:1.3; }
.detail .price{ font-size:24px; font-weight:800; color:var(--green); margin:10px 0; }
.spec-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
.spec{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
.spec .k{ font-size:10.5px; color:var(--sub); text-transform:uppercase; letter-spacing:.03em; }
.spec .v{ font-size:14px; font-weight:600; margin-top:2px; }
.back{ background:none; border:none; color:var(--red); font-size:14px; font-weight:600; display:flex; align-items:center; gap:4px; cursor:pointer; padding:14px 16px 0; }

.btn-secundario{
  display:flex; align-items:center; justify-content:center; gap:6px; width:100%; margin-top:18px;
  padding:12px; border-radius:10px; border:1px solid var(--red); background:none; color:var(--red);
  font-size:14px; font-weight:600; cursor:pointer;
}
.fotos-ajuda{ font-size:12.5px; color:var(--sub); margin:8px 0 16px; line-height:1.4; }
.fotos-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.foto-slot{
  position:relative; aspect-ratio:1/1; border-radius:10px; overflow:hidden;
  background:var(--card); border:1px solid var(--border);
}
.foto-slot img{ width:100%; height:100%; object-fit:cover; display:block; }
.foto-slot.vazio{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  color:var(--sub); border-style:dashed; cursor:pointer;
}
.foto-slot.vazio span{ font-size:11px; }
.foto-slot.vazio input[type=file]{ position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; }
.foto-remover{
  position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%;
  background:rgba(0,0,0,.55); color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.fotos-status{ margin-top:14px; font-size:13px; color:var(--sub); min-height:16px; }

.toast{
  position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%);
  background:#1c1c1e; color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; opacity:0; pointer-events:none;
  transition:opacity .25s; z-index:50; max-width:90%; text-align:center;
}
.toast.show{ opacity:1; }

.offline-banner{ background:#7a3b12; color:#fff; font-size:12px; text-align:center; padding:6px; display:none; }
.offline-banner.show{ display:block; }

.error-box{ margin:16px; padding:14px; border-radius:10px; background:#fdeceb; color:#a3251d; font-size:12.5px; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .error-box{background:#3a1917;color:#f5a199;} }
:root[data-theme="dark"] .error-box{background:#3a1917;color:#f5a199;}

/* Cobre com a cor do cabeçalho a faixa do notch/status bar no iPhone */
.safe-top-fill{ position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top,0px); background:var(--red-dark); z-index:40; }

/* BOTTOM NAV */
.bottombar{
  display:flex; border-top:1px solid var(--border); background:var(--card);
  padding-bottom:env(safe-area-inset-bottom,0px); position:sticky; bottom:0; z-index:20;
}
.bottombar button{
  flex:1; background:none; border:none; padding:10px 8px 8px; display:flex; flex-direction:column;
  align-items:center; gap:2px; color:var(--sub); font-size:11px; cursor:pointer;
}
.bottombar button.active{ color:var(--red); }

/* LIGHTBOX (foto em tela cheia) */
.lightbox{
  position:fixed; inset:0; background:#000; z-index:100; display:none;
  flex-direction:column; align-items:center; justify-content:center;
}
.lightbox.show{ display:flex; }
.lightbox-back{
  position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); left:14px; z-index:2;
  background:rgba(255,255,255,.15); border:none; color:#fff; padding:8px 14px; border-radius:20px;
  font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px; cursor:pointer;
}
.lightbox-share{
  position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; z-index:2;
  background:rgba(255,255,255,.15); border:none; color:#fff; width:36px; height:36px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.lightbox-share.enviando{ opacity:.5; pointer-events:none; }
.lightbox img{ max-width:100%; max-height:82vh; object-fit:contain; touch-action:pan-y; }
.lightbox .hero-dots{ margin-top:16px; margin-bottom:0; }
.lightbox .hero-dots .dot{ background:rgba(255,255,255,.35); }
.lightbox .hero-dots .dot.active{ background:#fff; }
</style>
</head>
<body>
<div class="safe-top-fill"></div>
<div id="app">
  <div class="offline-banner" id="offlineBanner">Sem conexão — exibindo os últimos dados sincronizados</div>
  <header>
    <button class="icon" id="menuBtn" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="title" id="headerTitle">Gestão de Equipamentos</div>
    <button class="icon" id="syncBtn" aria-label="Sincronizar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
    <div class="avatar" id="avatar">-</div>
  </header>
  <main id="main"></main>
  <nav class="bottombar" id="bottombar" style="display:none;">
    <button id="btnNavHome">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      Início
    </button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-back" id="lightboxBack">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Voltar
  </button>
  <button class="lightbox-share" id="lightboxShare" aria-label="Compartilhar foto">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
  </button>
  <img id="lightboxImg" src="" alt="">
  <div class="hero-dots" id="lightboxDots"></div>
</div>

<script>
/* =========================================================================
   CONFIGURAÇÃO — cole aqui a URL do seu Web App do Google Apps Script
   (na planilha: Extensões > Apps Script > cole o Code.gs > Implantar >
   Nova implantação > App da Web > Executar como "Eu" > Acesso "Qualquer
   pessoa" > copie a URL gerada e cole abaixo, entre aspas)
   ========================================================================= */
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzDxdbh10SBLMC9bDXEyxCyR9aLK0NVtNDHSTRU3IHdTUtNqcJUxRLiCzwcSZBjVgZTJQ/exec';

// Precisa ser IDÊNTICO ao APP_TOKEN do Code.gs — é a chave que autoriza o
// app a ler a planilha. Se você trocar uma, troque a outra também.
var APP_TOKEN = '3gdBbgT6_eO4Zx5m-45j7Eb7Ge4K6GkI';

function configurado(){
  return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('http') === 0;
}

async function buscarDados(){
  if(!configurado()) return { ok:false, erro:'App ainda não configurado (falta a URL do Apps Script no topo do index.html).' };
  if(!state.sessao) return { ok:false, erro:'Sessão expirada, faça login novamente.', sessaoExpirada:true };
  try{
    var url = APPS_SCRIPT_URL + '?action=dados&token=' + encodeURIComponent(APP_TOKEN) + '&sessao=' + encodeURIComponent(state.sessao);
    var resp = await fetch(url, { cache:'no-store' });
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    return await resp.json();
  }catch(e){
    return { ok:false, erro:'Não foi possível sincronizar agora.' };
  }
}

async function autenticar(usuario, senha){
  if(!configurado()) return { ok:false, erro:'App ainda não configurado (falta a URL do Apps Script no topo do index.html).' };
  var url = APPS_SCRIPT_URL + '?action=login&login=' + encodeURIComponent(usuario) + '&senha=' + encodeURIComponent(senha) + '&token=' + encodeURIComponent(APP_TOKEN);
  var resp = await fetch(url, { cache:'no-store' });
  if(!resp.ok) throw new Error('HTTP ' + resp.status);
  return resp.json();
}

/* Chamadas administrativas (upload/remoção de foto) — só usadas quando
   state.vendedor.admin é true. Vão por POST com Content-Type "text/plain"
   de propósito: isso evita o "preflight" de CORS que o Apps Script não
   responde, mesmo o corpo sendo um JSON de verdade (o Code.gs faz o parse
   manualmente em doPost). */
async function chamarAdminApi(payload){
  if(!configurado()) return { ok:false, erro:'App ainda não configurado (falta a URL do Apps Script no topo do index.html).' };
  if(!state.sessao) return { ok:false, erro:'Sessão expirada, faça login novamente.', sessaoExpirada:true };
  payload = Object.assign({ token: APP_TOKEN, sessao: state.sessao }, payload);
  try{
    var resp = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    return await resp.json();
  }catch(e){
    return { ok:false, erro:'Não foi possível enviar agora. Verifique sua conexão.' };
  }
}

/* Lê um arquivo de imagem escolhido no celular, redimensiona (lado maior
   até 1600px) e comprime como JPEG — evita mandar fotos de 10-20MB direto
   da câmera. Devolve só o base64 (sem o prefixo "data:image/jpeg;..."). */
function arquivoParaJpegBase64(file, ladoMax){
  ladoMax = ladoMax || 1600;
  return new Promise(function(resolve, reject){
    var leitor = new FileReader();
    leitor.onerror = function(){ reject(new Error('Falha ao ler o arquivo')); };
    leitor.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error('Arquivo não é uma imagem válida')); };
      img.onload = function(){
        var w = img.width, h = img.height;
        var maior = Math.max(w, h);
        if(maior > ladoMax){
          var escala = ladoMax / maior;
          w = Math.round(w * escala); h = Math.round(h * escala);
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82).split(',')[1]);
      };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(file);
  });
}

/* Categorias do menu inicial — os ids batem com o nome das abas da planilha.
   "icon" é o ícone padrão desenhado (usado como reserva). "imagem" é o
   arquivo que você pode subir no GitHub para substituir esse ícone — se
   o arquivo não existir, o ícone padrão continua aparecendo normalmente. */
var CATEGORIAS_MENU = [
  { id:'NOVOS', label:'Novos', icon:'tag', imagem:'icon-novos.png' },
  { id:'USADOS', label:'Usados', icon:'tractor', imagem:'icon-usados.png' },
  { id:'AFS', label:'AFS', icon:'satellite', imagem:'icon-afs.png' }
];

var ICONS = {
  tag: '<path d="M20.59 13.41 11 22 2 13V4h9l9.59 9.41Z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  tractor: '<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M8 17h6"/><path d="M12 17V7h4l2 4h2v3"/>',
  satellite: '<path d="M13 7 9 3 5 7l4 4"/><path d="M17 11l4 4-4 4-4-4"/><path d="M8 12l4 4"/><path d="M3 21l3-3"/>',
  chev: '<polyline points="9 18 15 12 9 6"/>',
  box: '<path d="M21 8V6a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 6v12a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 18v-2"/><path d="M3.27 6.96 12 12.01l8.73-5.05"/><path d="M12 22.08V12"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/>',
  close: '<path d="M18 6 6 18"/><path d="M6 6l12 12"/>',
  camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/>',
  trash: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>'
};
var MAX_FOTOS = 10; // precisa bater com o nº de colunas "Imagem N" que você mantém na planilha
function icon(name, size){ size = size || 24; return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.box)+'</svg>'; }
function onImgError(el, size){ el.outerHTML = icon('box', size); }
function onCategoriaImgError(el, nomeIcone){ el.outerHTML = icon(nomeIcone, 24); }
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

/* Detecta um "swipe" horizontal de dedo e chama onLeft (próxima) ou onRight (anterior) */
function attachSwipe(el, onLeft, onRight){
  if(!el) return;
  var sx=0, sy=0, active=false;
  el.addEventListener('touchstart', function(e){
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY; active = true;
  }, { passive:true });
  el.addEventListener('touchend', function(e){
    if(!active) return; active = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
      if(dx < 0) onLeft(); else onRight();
    }
  }, { passive:true });
}

/* ---------- Estado / armazenamento offline ---------- */
var store = {
  get: function(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

var state = {
  vendedor: store.get('vendedor', null),
  sessao: store.get('sessao', null),
  produtos: store.get('produtos_cache', null),
  lastSync: store.get('last_sync', null),
  view: 'home',       // home | lista | detalhe
  tipo: null,          // NOVOS / USADOS / AFS
  filtroCategoria: 'TODAS',
  busca: '',
  produtoAtual: null,
  erro: null
};

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

async function sync(force){
  var data = await buscarDados();
  if(!data || !data.ok){
    if(data && data.sessaoExpirada){
      encerrarSessao();
      toast('Sessão expirada — faça login de novo');
      render();
      return false;
    }
    state.erro = (data && data.erro) || 'Não foi possível sincronizar agora.';
    if(!state.produtos) state.produtos = [];
    return false;
  }
  state.produtos = data.produtos;
  state.lastSync = data.sincronizadoEm || new Date().toISOString();
  state.erro = null;
  store.set('produtos_cache', state.produtos);
  store.set('last_sync', state.lastSync);
  return true;
}

function fmtPreco(v){
  if(v === null || v === undefined || v === '') return 'Sob consulta';
  return Number(v).toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });
}
function fmtSync(iso){
  if(!iso) return 'nunca sincronizado';
  var d = new Date(iso);
  return 'sincronizado às ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

/* ---------- Navegação ---------- */
function goHome(){ state.view='home'; render(); }
function goLista(tipoId){ state.view='lista'; state.tipo=tipoId; state.filtroCategoria='TODAS'; state.busca=''; render(); }
function goDetalhe(produto){ state.view='detalhe'; state.produtoAtual=produto; state.fotoIdx=0; render(); }
function goFotos(){ state.view='fotos'; render(); }

/* ---------- Render ---------- */
function render(){
  var main = document.getElementById('main');
  var title = document.getElementById('headerTitle');
  document.getElementById('avatar').textContent = state.vendedor ? state.vendedor.nome[0].toUpperCase() : '-';
  document.getElementById('bottombar').style.display = state.vendedor ? 'flex' : 'none';

  if(!state.vendedor){
    title.textContent = 'Gestão de Equipamentos';
    main.innerHTML = renderLogin();
    bindLogin();
    return;
  }

  if(state.view==='home'){
    title.textContent = 'Início';
    main.innerHTML = renderHome();
    bindHome();
  } else if(state.view==='lista'){
    title.textContent = state.tipo==='NOVOS' ? 'Novos' : state.tipo==='USADOS' ? 'Usados' : 'AFS';
    main.innerHTML = renderLista();
    bindLista();
  } else if(state.view==='detalhe'){
    title.textContent = 'Detalhe';
    main.innerHTML = renderDetalhe();
    bindDetalhe();
  } else if(state.view==='fotos'){
    title.textContent = 'Fotos';
    main.innerHTML = renderFotos();
    bindFotos();
  }
}

function renderLogin(){
  var aviso = !configurado() ? '<div class="error-box">Este app ainda não está ligado à planilha: cole a URL do Apps Script no topo do index.html.</div>' : '';
  return '' +
    '<div class="login-wrap">' +
      icon('tractor',44) +
      '<h1>Agroser - Lista de preços</h1>' +
      '<p>Informe seu login e senha cadastrados na planilha para acessar a lista — funciona mesmo sem internet após o primeiro acesso.</p>' +
      '<input id="loginInput" type="text" autocapitalize="none" autocomplete="username" placeholder="Usuário">' +
      '<input id="senhaInput" type="password" autocomplete="current-password" placeholder="Senha">' +
      '<button class="btn" id="btnEntrar">Entrar</button>' +
      aviso +
    '</div>';
}
function bindLogin(){
  var btn = document.getElementById('btnEntrar');
  btn.onclick = async function(){
    var usuario = document.getElementById('loginInput').value.trim();
    var senha = document.getElementById('senhaInput').value.trim();
    if(!usuario || !senha){ toast('Informe usuário e senha'); return; }
    btn.disabled = true; btn.textContent = 'Entrando...';
    try{
      var resultado = await autenticar(usuario, senha);
      if(resultado.ok){
        state.vendedor = { nome: resultado.nome, admin: !!resultado.admin };
        state.sessao = resultado.sessao;
        store.set('vendedor', state.vendedor);
        store.set('sessao', state.sessao);
        if(!state.produtos || !state.produtos.length){ await sync(false); }
        toast('Bem-vindo, ' + resultado.nome);
        goHome();
      } else {
        toast(resultado.erro || 'Usuário ou senha incorretos');
      }
    }catch(e){
      toast('Sem conexão para validar o login agora');
    }finally{
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  };
}

function renderHome(){
  var counts = { NOVOS:0, USADOS:0, AFS:0 };
  (state.produtos||[]).forEach(function(p){ if(counts[p.tipo]!==undefined) counts[p.tipo]++; });
  var rows = CATEGORIAS_MENU.map(function(c){
    var conteudoIcone = c.imagem
      ? '<img src="'+c.imagem+'" alt="" onerror="onCategoriaImgError(this,\''+c.icon+'\')">'
      : icon(c.icon,24);
    return '' +
    '<div class="row" data-tipo="'+c.id+'">' +
      '<div class="icon-circle">'+conteudoIcone+'</div>' +
      '<div class="label">'+c.label+'</div>' +
      '<div class="count">'+counts[c.id]+'</div>' +
      '<div class="chev">'+icon('chev',18)+'</div>' +
    '</div>';
  }).join('');
  var erro = state.erro ? '<div class="error-box">'+state.erro+'</div>' : '';
  return '' +
    '<img id="logoEmpresa" class="logo-empresa" src="logo.png" alt="" onerror="this.style.display=\'none\'">' +
    '<div class="subbar">' +
      '<h2>Início</h2>' +
      '<div class="sync-status">'+fmtSync(state.lastSync)+'</div>' +
    '</div>' +
    erro +
    rows;
}
function bindHome(){
  document.querySelectorAll('.row[data-tipo]').forEach(function(el){
    el.onclick = function(){ goLista(el.dataset.tipo); };
  });
}

function normalizarBusca(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}
function produtosFiltrados(){
  var all = (state.produtos||[]).filter(function(p){ return p.tipo===state.tipo; });
  var porCategoria = state.filtroCategoria==='TODAS' ? all : all.filter(function(p){ return p.categoria===state.filtroCategoria; });
  var termo = normalizarBusca(state.busca);
  if(!termo) return porCategoria;
  return porCategoria.filter(function(p){
    var alvo = normalizarBusca([p.nome,p.fornecedor,p.lote,p.categoria,p.ano].join(' '));
    return alvo.indexOf(termo) > -1;
  });
}
function renderListaItems(){
  var filtered = produtosFiltrados();
  return filtered.length ? filtered.map(function(p){
    return '' +
    '<div class="item" data-idx="'+state.produtos.indexOf(p)+'">' +
      '<div class="thumb">'+(p.imagens && p.imagens.length ? '<img src="'+escapeAttr(p.imagens[0])+'" alt="" onerror="onImgError(this,26)">' : icon('box',26))+'</div>' +
      '<div class="info">' +
        '<div class="nome">'+p.nome+'</div>' +
        '<div class="meta">'+p.fornecedor+(p.ano?' · '+p.ano:'')+' · Lote '+p.lote+'</div>' +
        '<div class="preco">'+fmtPreco(p.preco)+'</div>' +
      '</div>' +
    '</div>';
  }).join('') : '<div class="empty">'+(state.busca?'Nenhum item encontrado para "'+escapeAttr(state.busca)+'".':'Nenhum item nessa categoria ainda.')+'</div>';
}
function renderLista(){
  var all = (state.produtos||[]).filter(function(p){ return p.tipo===state.tipo; });
  var cats = ['TODAS'].concat(Array.from(new Set(all.map(function(p){ return p.categoria; }).filter(Boolean))).sort());
  var chips = cats.map(function(c){
    return '<div class="chip '+(c===state.filtroCategoria?'active':'')+'" data-cat="'+c+'">'+(c==='TODAS'?'Todas':c[0]+c.slice(1).toLowerCase())+'</div>';
  }).join('');
  return '' +
    '<button class="back" id="btnBack">'+icon('chev',16).replace('9 18 15 12 9 6','15 18 9 12 15 6')+' Início</button>' +
    '<div class="search-box">' +
      icon('search',16) +
      '<input id="buscaInput" type="search" inputmode="search" autocomplete="off" placeholder="Buscar por nome, lote, fornecedor..." value="'+escapeAttr(state.busca)+'">' +
      '<button class="search-clear" id="buscaClear" type="button" style="display:'+(state.busca?'flex':'none')+'">'+icon('close',14)+'</button>' +
    '</div>' +
    '<div class="filters">'+chips+'</div>' +
    '<div id="listaItems">'+renderListaItems()+'</div>';
}
function bindListaItems(){
  document.querySelectorAll('.item[data-idx]').forEach(function(el){
    el.onclick = function(){ goDetalhe(state.produtos[+el.dataset.idx]); };
  });
}
function bindLista(){
  document.getElementById('btnBack').onclick = goHome;
  document.querySelectorAll('.chip').forEach(function(el){
    el.onclick = function(){ state.filtroCategoria = el.dataset.cat; render(); };
  });
  var input = document.getElementById('buscaInput');
  var clearBtn = document.getElementById('buscaClear');
  input.oninput = function(){
    state.busca = input.value;
    clearBtn.style.display = state.busca ? 'flex' : 'none';
    document.getElementById('listaItems').innerHTML = renderListaItems();
    bindListaItems();
  };
  clearBtn.onclick = function(){
    state.busca = '';
    input.value = '';
    clearBtn.style.display = 'none';
    document.getElementById('listaItems').innerHTML = renderListaItems();
    bindListaItems();
    input.focus();
  };
  bindListaItems();
}

function renderDetalhe(){
  var p = state.produtoAtual;
  var fotos = p.imagens || [];
  var idx = Math.min(state.fotoIdx||0, Math.max(fotos.length-1,0));
  var heroConteudo = fotos.length
    ? '<img src="'+escapeAttr(fotos[idx])+'" alt="" onerror="onImgError(this,56)">'
    : icon('box',56);
  var dots = fotos.length>1 ? '<div class="hero-dots">'+fotos.map(function(_,i){
      return '<div class="dot '+(i===idx?'active':'')+'" data-foto="'+i+'"></div>';
    }).join('')+'</div>' : '';
  return '' +
    '<button class="back" id="btnBack">'+icon('chev',16).replace('9 18 15 12 9 6','15 18 9 12 15 6')+' Voltar</button>' +
    '<div class="detail">' +
      '<div class="hero" id="heroFoto">'+heroConteudo+'</div>' +
      dots +
      '<span class="badge '+(p.tipo==='NOVOS'?'novo':'usado')+'">'+p.tipo+'</span>' +
      '<h2>'+p.nome+'</h2>' +
      '<div class="price">'+fmtPreco(p.preco)+'</div>' +
      '<div class="spec-grid">' +
        '<div class="spec"><div class="k">Categoria</div><div class="v">'+p.categoria+'</div></div>' +
        '<div class="spec"><div class="k">Fornecedor</div><div class="v">'+p.fornecedor+'</div></div>' +
        '<div class="spec"><div class="k">Ano/Modelo</div><div class="v">'+(p.ano||'—')+'</div></div>' +
        '<div class="spec"><div class="k">Lote</div><div class="v">'+p.lote+'</div></div>' +
        '<div class="spec"><div class="k">Status</div><div class="v">'+p.status+'</div></div>' +
        (p.local ? '<div class="spec"><div class="k">Local</div><div class="v">'+p.local+'</div></div>' : '') +
      '</div>' +
      (state.vendedor && state.vendedor.admin ?
        '<button class="btn-secundario" id="btnEditarFotos">'+icon('camera',16)+' Editar fotos</button>' : '') +
    '</div>';
}
function bindDetalhe(){
  var p = state.produtoAtual;
  var fotos = p.imagens || [];

  document.getElementById('btnBack').onclick = function(){ state.view='lista'; render(); };
  var btnEditarFotos = document.getElementById('btnEditarFotos');
  if(btnEditarFotos) btnEditarFotos.onclick = goFotos;
  document.querySelectorAll('.hero-dots .dot').forEach(function(el){
    el.onclick = function(){ state.fotoIdx = +el.dataset.foto; render(); };
  });

  var hero = document.getElementById('heroFoto');
  if(fotos.length){
    var idxAtual = Math.min(state.fotoIdx||0, fotos.length-1);
    attachSwipe(hero,
      function(){ state.fotoIdx = (idxAtual+1) % fotos.length; render(); },      // arrastou p/ esquerda -> próxima
      function(){ state.fotoIdx = (idxAtual-1+fotos.length) % fotos.length; render(); } // arrastou p/ direita -> anterior
    );
    var heroImg = hero.querySelector('img');
    if(heroImg){
      heroImg.style.cursor = 'pointer';
      heroImg.onclick = function(){ abrirLightbox(fotos, idxAtual); };
    }
  }
}

/* ---------- Editar fotos (só admin) ---------- */
function renderFotos(){
  var p = state.produtoAtual;
  var fotos = p.imagens || [];
  var slots = '';
  for(var i=1; i<=MAX_FOTOS; i++){
    var url = fotos[i-1];
    if(url){
      slots += '' +
        '<div class="foto-slot" data-slot="'+i+'">' +
          '<img src="'+escapeAttr(url)+'" alt="" onerror="onImgError(this,22)">' +
          '<button class="foto-remover" data-slot="'+i+'" type="button">'+icon('trash',16)+'</button>' +
        '</div>';
    } else {
      slots += '' +
        '<label class="foto-slot vazio" data-slot="'+i+'">' +
          icon('camera',22) +
          '<span>Adicionar</span>' +
          '<input type="file" accept="image/*" data-slot="'+i+'" class="foto-input">' +
        '</label>';
    }
  }
  return '' +
    '<button class="back" id="btnBack">'+icon('chev',16).replace('9 18 15 12 9 6','15 18 9 12 15 6')+' Voltar</button>' +
    '<div class="detail">' +
      '<h2>'+p.nome+'</h2>' +
      '<p class="fotos-ajuda">Toque em um quadro vazio para adicionar uma foto (câmera ou galeria), ou na lixeira para remover.</p>' +
      '<div class="fotos-grid">'+slots+'</div>' +
      '<div id="fotosStatus" class="fotos-status"></div>' +
    '</div>';
}
function fotosStatus(msg){
  var el = document.getElementById('fotosStatus');
  if(el) el.textContent = msg || '';
}
function atualizarImagensProduto(imagens){
  state.produtoAtual.imagens = imagens;
  var i = state.produtos.indexOf(state.produtoAtual);
  if(i === -1){
    i = state.produtos.findIndex(function(x){ return x.lote===state.produtoAtual.lote && x.tipo===state.produtoAtual.tipo; });
  }
  if(i > -1){ state.produtos[i].imagens = imagens; }
  store.set('produtos_cache', state.produtos);
}
function bindFotos(){
  document.getElementById('btnBack').onclick = function(){ state.view='detalhe'; render(); };

  document.querySelectorAll('.foto-input').forEach(function(input){
    input.onchange = async function(){
      var file = input.files && input.files[0];
      if(!file) return;
      var slot = +input.dataset.slot;
      fotosStatus('Enviando foto...');
      try{
        var base64 = await arquivoParaJpegBase64(file);
        var resultado = await chamarAdminApi({
          action: 'upload_foto',
          tipo: state.produtoAtual.tipo,
          lote: state.produtoAtual.lote,
          slot: slot,
          mime: 'image/jpeg',
          base64: base64
        });
        if(resultado && resultado.ok){
          atualizarImagensProduto(resultado.imagens || []);
          toast('Foto adicionada');
          fotosStatus('');
          render();
        } else if(resultado && resultado.sessaoExpirada){
          encerrarSessao();
          toast('Sessão expirada — faça login de novo');
        } else {
          fotosStatus('');
          toast((resultado && resultado.erro) || 'Não foi possível enviar a foto');
        }
      }catch(e){
        fotosStatus('');
        toast('Não foi possível processar essa imagem');
      }
    };
  });

  document.querySelectorAll('.foto-remover').forEach(function(btn){
    btn.onclick = async function(){
      var slot = +btn.dataset.slot;
      if(!confirm('Remover essa foto?')) return;
      fotosStatus('Removendo foto...');
      var resultado = await chamarAdminApi({
        action: 'remover_foto',
        tipo: state.produtoAtual.tipo,
        lote: state.produtoAtual.lote,
        slot: slot
      });
      if(resultado && resultado.ok){
        atualizarImagensProduto(resultado.imagens || []);
        toast('Foto removida');
        fotosStatus('');
        render();
      } else if(resultado && resultado.sessaoExpirada){
        encerrarSessao();
        toast('Sessão expirada — faça login de novo');
      } else {
        fotosStatus('');
        toast((resultado && resultado.erro) || 'Não foi possível remover a foto');
      }
    };
  });
}

/* ---------- Visualizador de foto em tela cheia ---------- */
var lightbox = { fotos:[], idx:0 };
function abrirLightbox(fotos, idx){
  lightbox.fotos = fotos; lightbox.idx = idx;
  renderLightbox();
  document.getElementById('lightbox').classList.add('show');
}
function fecharLightbox(){
  document.getElementById('lightbox').classList.remove('show');
}
function renderLightbox(){
  document.getElementById('lightboxImg').src = lightbox.fotos[lightbox.idx];
  var dotsEl = document.getElementById('lightboxDots');
  dotsEl.innerHTML = lightbox.fotos.length > 1 ? lightbox.fotos.map(function(_,i){
    return '<div class="dot '+(i===lightbox.idx?'active':'')+'"></div>';
  }).join('') : '';
}
document.getElementById('lightboxBack').onclick = fecharLightbox;

/* Baixa a foto atual e abre o menu de compartilhamento nativo do celular
   já com o ARQUIVO da imagem (não o link) — assim, ao escolher WhatsApp
   por exemplo, vai a foto de verdade, igual quando se compartilha uma
   foto salva na galeria. */
document.getElementById('lightboxShare').onclick = async function(){
  var btn = this;
  var url = lightbox.fotos[lightbox.idx];
  if(!url) return;
  btn.classList.add('enviando');
  try{
    var resp = await fetch(url, { mode:'cors' });
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    var blob = await resp.blob();
    var arquivo = new File([blob], 'foto.jpg', { type: blob.type || 'image/jpeg' });
    if(navigator.canShare && navigator.canShare({ files:[arquivo] })){
      await navigator.share({ files:[arquivo] });
    } else if(navigator.share){
      await navigator.share({ url: url });
      toast('Seu navegador só permite compartilhar o link, não o arquivo da foto');
    } else {
      throw new Error('sem suporte a compartilhamento');
    }
  }catch(e){
    if(e && e.name !== 'AbortError'){
      toast('Não foi possível preparar a foto para compartilhar. Toque e segure a imagem para salvá-la, e compartilhe pela galeria.');
    }
  }finally{
    btn.classList.remove('enviando');
  }
};

attachSwipe(document.getElementById('lightbox'),
  function(){ if(lightbox.fotos.length<2) return; lightbox.idx = (lightbox.idx+1) % lightbox.fotos.length; renderLightbox(); },
  function(){ if(lightbox.fotos.length<2) return; lightbox.idx = (lightbox.idx-1+lightbox.fotos.length) % lightbox.fotos.length; renderLightbox(); }
);
document.getElementById('btnNavHome').onclick = function(){ if(state.vendedor) goHome(); };

/* ---------- Sync / menu / offline ---------- */
document.getElementById('syncBtn').onclick = async function(){
  if(!navigator.onLine){ toast('Sem conexão — não é possível sincronizar agora'); return; }
  toast('Sincronizando...');
  var ok = await sync(true);
  toast(ok ? 'Dados atualizados' : (state.erro || 'Falha ao sincronizar'));
  render();
};
function encerrarSessao(){
  state.vendedor = null;
  state.sessao = null;
  localStorage.removeItem('vendedor');
  localStorage.removeItem('sessao');
  goHome();
}
function sairDaConta(){
  if(!state.vendedor) return;
  if(confirm('Sair da conta de ' + state.vendedor.nome + '?')){
    encerrarSessao();
  }
}
document.getElementById('menuBtn').onclick = sairDaConta;
document.getElementById('avatar').onclick = sairDaConta;
function updateOfflineBanner(){
  document.getElementById('offlineBanner').classList.toggle('show', !navigator.onLine);
}
window.addEventListener('online', updateOfflineBanner);
window.addEventListener('offline', updateOfflineBanner);
updateOfflineBanner();

/* Primeira carga: se não houver cache local, busca os dados atuais da planilha */
(async function(){
  if(!state.produtos){ await sync(false); }
  render();
})();

/* ---------- Trava zoom por pinça / duplo toque (Safari ignora um pouco o viewport) ---------- */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('gesturechange', function(e){ e.preventDefault(); });
var _ultimoToque = 0;
document.addEventListener('touchend', function(e){
  var agora = Date.now();
  if(agora - _ultimoToque <= 300){ e.preventDefault(); }
  _ultimoToque = agora;
}, { passive:false });

/* ---------- PWA: registra o service worker para funcionar offline ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* ambiente sem suporte a SW, segue sem offline completo */ });
  });
}
</script>
